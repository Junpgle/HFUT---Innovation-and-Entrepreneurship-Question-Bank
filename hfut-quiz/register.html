<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册账号 - HFUT 创新创业</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 LeanCloud SDK -->
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
  <style>
    body {
      background-color: #0f172a; /* Slate 900 */
      font-family: system-ui, -apple-system, sans-serif;
      background-image: radial-gradient(at 0% 0%, rgba(30, 64, 175, 0.2) 0, transparent 50%),
      radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.2) 0, transparent 50%);
      min-height: 100vh;
      color: white;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(71, 85, 105, 0.5);
      border-radius: 0.75rem;
      color: white;
      transition: all 0.2s;
      outline: none;
    }
    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 移动端适配 */
    @media (max-width: 640px) {
      .container-box { padding: 1.5rem; }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

<div class="w-full max-w-md p-8 rounded-3xl glass-card shadow-2xl container-box animate-fade-in">
  <!-- Header -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">注册新账号</h1>
    <p class="text-slate-400 text-sm">HFUT 创新创业题库 Pro</p>
  </div>

  <!-- Form -->
  <div class="space-y-5">
    <div>
      <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">用户名 <span class="text-red-400">*</span></label>
      <input type="text" id="username" class="form-input" placeholder="6-15位字母或数字">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">电子邮箱 <span class="text-red-400">*</span></label>
      <input type="email" id="email" class="form-input" placeholder="用于找回密码">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">密码 <span class="text-red-400">*</span></label>
      <input type="password" id="password" class="form-input" placeholder="至少8位字符">
    </div>

    <!-- Message Area -->
    <div id="msg-box" class="hidden p-3 rounded-xl text-sm text-center border"></div>

    <button id="submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all active:scale-[0.98] flex items-center justify-center">
      立即注册
    </button>

    <div class="text-center pt-2">
      <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors">
        已有账号？<span class="text-blue-400">返回登录</span>
      </a>
    </div>
  </div>
</div>

<script>
  // 配置 LeanCloud (请确保与 App.jsx 一致)
  const APP_ID = "5wPsbnakcoOjfaPzfC44vfW5-gzGzoHsz";
  const APP_KEY = "j9qbdfjiJAPsqbGUy04COFTD";
  const SERVER_URL = "https://5wpsbnak.lc-cn-n1-shared.com";

  AV.init({ appId: APP_ID, appKey: APP_KEY, serverURL: SERVER_URL });

  const btn = document.getElementById('submit-btn');
  const msgBox = document.getElementById('msg-box');

  function showMessage(text, isError) {
    msgBox.innerText = text;
    msgBox.className = `p-3 rounded-xl text-sm text-center border ${isError ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-green-500/10 text-green-400 border-green-500/20'}`;
    msgBox.classList.remove('hidden');
  }

  btn.onclick = async () => {
    const user = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();

    // 验证
    if (user.length < 6) return showMessage("用户名至少需要6位", true);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMessage("请输入有效的邮箱地址", true);
    if (pass.length < 8) return showMessage("密码至少需要8位", true);

    // loading
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 注册中...';
    msgBox.classList.add('hidden');

    const newUser = new AV.User();
    newUser.setUsername(user);
    newUser.setPassword(pass);
    newUser.setEmail(email);

    try {
      await newUser.signUp();
      showMessage("🎉 注册成功！即将跳转登录...", false);
      setTimeout(() => {
        window.location.href = "index.html"; // 跳转回主页
      }, 1500);
    } catch (error) {
      console.error(error);
      let text = "注册失败";
      if (error.code === 202) text = "用户名已被占用";
      if (error.code === 203) text = "该邮箱已被注册";
      showMessage(text, true);
      btn.disabled = false;
      btn.innerHTML = '立即注册';
    }
  };
</script>
</body>
</html>
