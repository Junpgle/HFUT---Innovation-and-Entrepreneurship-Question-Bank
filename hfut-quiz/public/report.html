<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>学习数据报表 - HFUT 创新创业</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.292.0"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #loading { position: fixed; inset: 0; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
        .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="loading">
    <div class="spinner"></div>
    <p class="mt-3 text-sm text-slate-500 font-medium" id="loading-text">正在同步云端数据...</p>
</div>
<div id="root"></div>

<script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
        ChevronLeft, Calendar, BarChart3, CheckCircle, XCircle,
        Clock, ArrowRight, BookOpen, Layers, Zap, AlertCircle, Eye, X
    } from 'lucide-react';

    const safeGoHome = () => {
      const sameOrigin = document.referrer && document.referrer.startsWith(location.origin);
      const current = location.href;
      if (sameOrigin && window.history.length > 1) {
        history.back();
        // Fallback if history.back() is blocked/no-op
        setTimeout(() => { if (location.href === current) location.href = 'index.html'; }, 500);
      } else {
        location.href = 'index.html';
      }
    };


    const LC_APP_ID = "5wPsbnakcoOjfaPzfC44vfW5-gzGzoHsz";
    const LC_APP_KEY = "j9qbdfjiJAPsqbGUy04COFTD";
    const LC_SERVER_URL = "https://5wpsbnak.lc-cn-n1-shared.com";
    const GITHUB_BASE = "https://raw.githubusercontent.com/Junpgle/HFUT---Innovation-and-Entrepreneurship-Question-Bank/refs/heads/main/questions/";
    const LECTURES = [
        { id: 1, name: "第一讲：创新创业概述", file: "创新创业基础第一讲习题.xlsx", url: "http://lc-5wPsbnak.cn-n1.lcfile.com/sCwXv74yKdHuwzz440gSIKvciB8w5Oxt/%E5%88%9B%E6%96%B0%E5%88%9B%E4%B8%9A%E5%9F%BA%E7%A1%80%E7%AC%AC%E4%B8%80%E8%AE%B2%E4%B9%A0%E9%A2%98.xlsx" },
        { id: 2, name: "第二讲：创新思维与方法", file: "创新创业基础第二讲习题.xlsx", url: "http://lc-5wPsbnak.cn-n1.lcfile.com/LW7iNTXd04MjT6xIIgoghNavzJh78BM3/%E5%88%9B%E6%96%B0%E5%88%9B%E4%B8%9A%E5%9F%BA%E7%A1%80%E7%AC%AC%E4%BA%8C%E8%AE%B2%E4%B9%A0%E9%A2%98.xlsx" },
        { id: 3, name: "第三讲：机会与风险识别", file: "创新创业基础第三讲习题.xlsx", url: "http://lc-5wPsbnak.cn-n1.lcfile.com/89otiFHMEs0D6EPKY7h6nLLlKT4e3FlW/%E5%88%9B%E6%96%B0%E5%88%9B%E4%B8%9A%E5%9F%BA%E7%A1%80%E7%AC%AC%E4%B8%89%E8%AE%B2%E4%B9%A0%E9%A2%98.xlsx" },
        { id: 4, name: "第四讲：团队与资源整合", file: "创新创业基础第四讲习题.xlsx", url: "http://lc-5wPsbnak.cn-n1.lcfile.com/iDvr6YL2DqyDJNQ8WtHF8JoGu8VhXJpB/%E5%88%9B%E6%96%B0%E5%88%9B%E4%B8%9A%E5%9F%BA%E7%A1%80%E7%AC%AC%E5%9B%9B%E8%AE%B2%E4%B9%A0%E9%A2%98.xlsx" },
        { id: 5, name: "第五讲：商业模式与计划", file: "创新创业基础第五讲习题.xlsx", url: "http://lc-5wPsbnak.cn-n1.lcfile.com/pmwL2rBspHySjkkGLY6cT4jTSENOw2QE/%E5%88%9B%E6%96%B0%E5%88%9B%E4%B8%9A%E5%9F%BA%E7%A1%80%E7%AC%AC%E4%BA%94%E8%AE%B2%E4%B9%A0%E9%A2%98.xlsx" },
        { id: 6, name: "第六讲：融资与企业设立", file: "创新创业基础第六讲习题.xlsx", url: "http://lc-5wPsbnak.cn-n1.lcfile.com/7ftQpmkKv4VtISulAbszw5y9gMtShUUO/%E5%88%9B%E6%96%B0%E5%88%9B%E4%B8%9A%E5%9F%BA%E7%A1%80%E7%AC%AC%E5%85%AD%E8%AE%B2%E4%B9%A0%E9%A2%98.xlsx" },
        { id: 7, name: "第七讲：新企业成长管理", file: "创新创业基础第七讲习题.xlsx", url: "http://lc-5wPsbnak.cn-n1.lcfile.com/ng2YT8p8yeERNwiaPXWMJBFwEdPwM7XI/%E5%88%9B%E6%96%B0%E5%88%9B%E4%B8%9A%E5%9F%BA%E7%A1%80%E7%AC%AC%E4%B8%83%E8%AE%B2%E4%B9%A0%E9%A2%98.xlsx" },
    ];

    const loadScript = async (urls) => {
        const load = (src) => new Promise((resolve, reject) => {
            if (document.querySelector(`script[src="${src}"]`)) return resolve();
            const s = document.createElement('script');
            s.src = src; s.crossOrigin = "anonymous";
            s.onload = resolve; s.onerror = () => reject(new Error(src));
            document.head.appendChild(s);
        });
        for (const url of urls) { try { await load(url); return; } catch (e) {} }
    };

    const parseExcel = (rows, lectureId) => {
        const clean = rows.filter(r => r && r.length > 0);
        if (!clean.length) return [];
        let start = JSON.stringify(clean[0]).includes("题型") ? 1 : 0;
        const qs = [];
        for (let i = start; i < clean.length; i++) {
            const r = clean[i];
            const content = String(r[1]||"").trim();
            if (!content) continue;
            const type = String(r[0]||"").includes("多选") ? 'multiple' : (String(r[0]||"").includes("判断") ? 'judgment' : 'single');
            const ansRaw = String(r[2]||"").trim().toUpperCase();
            let correct = [];
            if (type === 'judgment') correct = /^[对T]/.test(ansRaw) ? [0] : [1];
            else {
                const opts = [r[6], r[7], r[8], r[9], r[10]].filter(o => o).map(String);
                for (let c of ansRaw) {
                    const idx = c.charCodeAt(0) - 65;
                    if (idx >= 0 && idx < opts.length) correct.push(idx);
                }
                if (opts.length > 0) qs.push({ id: `L${lectureId}-${i}`, type, question: content, options: opts, rawAnswer: correct.sort(), explanation: String(r[3]||"暂无解析").trim() });
            }
            if (type === 'judgment') qs.push({ id: `L${lectureId}-${i}`, type, question: content, options: ['正确', '错误'], rawAnswer: correct, explanation: String(r[3]||"暂无解析").trim() });
        }
        return qs;
    };

    function ReportApp() {
        const [ready, setReady] = useState(false);
        const [data, setData] = useState(null);
        const [bank, setBank] = useState({});
        const [selectedDate, setSelectedDate] = useState(null);
        const [viewingQuestion, setViewingQuestion] = useState(null); // Modal state
        const [gateReason, setGateReason] = useState('');

        // Init
        useEffect(() => {
            (async () => {
                try {
                    await loadScript(["https://unpkg.com/leancloud-storage@4.15.0/dist/av-min.js", "https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"]);
                    await loadScript(["https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js", "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"]);
                    await loadScript(["https://unpkg.com/localforage@1.10.0/dist/localforage.min.js", "https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"]);

                    if (window.AV) {
                        window.AV.init({ appId: LC_APP_ID, appKey: LC_APP_KEY, serverURL: LC_SERVER_URL });
                        const user = window.AV.User.current();
                        if (!user) {
                            setGateReason('尚未登录，请先登录后查看报表');
                            document.getElementById('loading').style.display = 'none';
                            return;
                        }
                        if (!user.getEmail() || !user.get('emailVerified')) {
                            setGateReason('需要绑定并验证邮箱后才能查看学习报表');
                            document.getElementById('loading').style.display = 'none';
                            return;
                        }

                        // 1. Fetch Cloud Data
                        const query = new window.AV.Query('UserProgress');
                        query.equalTo('user', user);
                        try {
                            const record = await query.first();
                            if (record) setData(record.toJSON());
                        } catch (e) { console.error("Data fetch error", e); }

                        // 2. Load Bank (Try Cache -> Network)
                        document.getElementById('loading-text').innerText = "加载题库资源...";
                        try {
                            const cached = await localforage.getItem('hf_bank_v2');
                            if (cached && Object.keys(cached).length > 0) {
                                setBank(cached);
                            } else {
                                const newBank = {};
                                const fetchWithFallback = async (lecture) => {
                                    const urls = [lecture.url, GITHUB_BASE + encodeURIComponent(lecture.file)];
                                    const errors = [];
                                    for (const u of urls) {
                                        try {
                                            const res = await fetch(u);
                                            if (!res.ok) { errors.push(`HTTP ${res.status}`); continue; }
                                            return await res.arrayBuffer();
                                        } catch (err) { errors.push(err.message); }
                                    }
                                    throw new Error(errors.join(' | '));
                                };

                                for (const l of LECTURES) {
                                    const buf = await fetchWithFallback(l);
                                    const wb = window.XLSX.read(new Uint8Array(buf), { type: 'array' });
                                    newBank[l.id] = parseExcel(window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }), l.id);
                                }
                                setBank(newBank);
                                localforage.setItem('hf_bank_v2', newBank);
                            }
                        } catch (e) { console.warn("Bank load error", e); }

                        setReady(true);
                        document.getElementById('loading').style.display = 'none';
                    }
                } catch (e) { alert("初始化失败: " + e.message); }
            })();
        }, []);

        // Calculations
        const history = data?.history || [];
        const brushedSet = new Set(data?.brushedIds || []);
        const masteredSet = new Set(data?.masteredIds || []);

        // Available Dates
        const dates = useMemo(() => {
            const d = [...new Set(history.map(h => new Date(h.timestamp).toLocaleDateString()))].sort((a,b) => new Date(b) - new Date(a));
            return d.length > 0 ? d : [new Date().toLocaleDateString()];
        }, [history]);

        useEffect(() => { if (!selectedDate && dates.length > 0) setSelectedDate(dates[0]); }, [dates]);

        // Daily Data
        const dailyRecords = useMemo(() => {
            if (!selectedDate) return [];
            return history.filter(h => new Date(h.timestamp).toLocaleDateString() === selectedDate)
                .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        }, [history, selectedDate]);

        const dailyStats = useMemo(() => {
            const total = dailyRecords.filter(h => h.action === 'answer').length;
            const correct = dailyRecords.filter(h => h.action === 'answer' && h.isCorrect).length;
            const mastered = new Set(dailyRecords.filter(h => h.isCorrect).map(h => h.questionId)).size;
            return { total, correct, rate: total ? Math.round(correct/total*100) : 0, mastered };
        }, [dailyRecords]);

        // Finding Question Details
        const getQuestionDetails = (qid) => {
            for (const lid in bank) {
                const q = bank[lid].find(i => i.id === qid);
                if (q) return q;
            }
            return null;
        };

        const openQuestion = (qid) => {
            const q = getQuestionDetails(qid);
            if (q) setViewingQuestion(q);
            else alert("题库中未找到该题（可能属于未加载章节或版本不匹配）");
        };

        if (gateReason) {
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
                    <div className="bg-white border border-slate-200 shadow-lg rounded-2xl p-6 w-full max-w-md space-y-4 text-center">
                        <AlertCircle className="mx-auto text-amber-500" size={32}/>
                        <div className="text-lg font-bold text-slate-800">访问受限</div>
                        <p className="text-slate-600 text-sm">{gateReason}</p>
                        <div className="grid grid-cols-1 gap-2">
                            <button onClick={() => location.href='profile.html'} className="w-full py-2.5 bg-blue-600 text-white rounded-xl font-bold">前往账号中心绑定邮箱</button>
                            <button onClick={safeGoHome} className="w-full py-2.5 bg-slate-100 text-slate-700 rounded-xl font-bold">返回主页</button>
                        </div>
                    </div>
                </div>
            );
        }

        if (!ready) return null;

        return (
            <div className="min-h-screen bg-slate-50 flex flex-col">
                {/* Navbar */}
                <div className="sticky top-0 bg-white border-b border-slate-200 z-10 px-4 py-3 flex items-center justify-between shadow-sm">
                    <button onClick={safeGoHome} className="p-2 -ml-2 text-slate-600 hover:bg-slate-50 rounded-full flex items-center gap-1">
                        <ChevronLeft size={20} /> <span className="text-sm font-bold">返回主页</span>
                    </button>
                    <h1 className="font-bold text-slate-800">数据报表</h1>
                    <div className="w-8"></div>
                </div>

                <div className="flex-1 max-w-3xl mx-auto w-full p-4 space-y-6">
                    {/* 1. Date Selector */}
                    <div className="overflow-x-auto no-scrollbar -mx-4 px-4">
                        <div className="flex gap-2 w-max">
                            {dates.map(d => (
                                <button key={d} onClick={() => setSelectedDate(d)}
                                        className={`px-4 py-2 rounded-full text-sm font-bold transition-all border ${
                                            selectedDate === d
                                                ? 'bg-blue-600 text-white border-blue-600 shadow-md'
                                                : 'bg-white text-slate-500 border-slate-200'
                                        }`}>
                                    {d === new Date().toLocaleDateString() ? '今天' : d.split('/')[1] + '.' + d.split('/')[2]}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* 2. Daily Summary Card */}
                    <div className="bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg animate-fade-in">
                        <div className="flex items-center gap-2 mb-6 opacity-90">
                            <Calendar size={18} />
                            <span className="font-bold">{selectedDate} 概览</span>
                        </div>
                        <div className="grid grid-cols-3 gap-4 text-center">
                            <div><div className="text-blue-100 text-xs mb-1">刷题量</div><div className="text-3xl font-bold">{dailyStats.total}</div></div>
                            <div><div className="text-blue-100 text-xs mb-1">正确率</div><div className="text-3xl font-bold">{dailyStats.rate}%</div></div>
                            <div><div className="text-blue-100 text-xs mb-1">新掌握</div><div className="text-3xl font-bold">{dailyStats.mastered}</div></div>
                        </div>
                    </div>

                    {/* 3. Chapter Stats */}
                    <div>
                        <h3 className="text-slate-500 font-bold text-sm mb-3 ml-1">全章节统计</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {LECTURES.map(l => {
                                const total = bank[l.id]?.length || 0;
                                const done = Array.from(brushedSet).filter(id => id.startsWith(`L${l.id}-`)).length;
                                const right = Array.from(masteredSet).filter(id => id.startsWith(`L${l.id}-`)).length;
                                const pct = total ? Math.round(done/total*100) : 0;

                                return (
                                    <div key={l.id} className="glass-card p-4 rounded-xl flex items-center justify-between">
                                        <div className="flex-1 mr-4">
                                            <div className="font-bold text-slate-700 text-sm truncate">{l.name.split("：")[1]}</div>
                                            <div className="mt-2 w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                                <div className="h-full bg-blue-500 rounded-full" style={{width: `${pct}%`}}></div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-lg font-bold text-slate-800">{pct}%</div>
                                            <div className="text-xs text-slate-400">{done}/{total}</div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* 4. Detailed List */}
                    <div className="glass-card rounded-2xl p-4 sm:p-6">
                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Clock size={18}/> 详细记录</h3>
                        <div className="space-y-4">
                            {dailyRecords.length === 0 ? <p className="text-center text-slate-400 py-8">本日暂无记录</p> : dailyRecords.map(h => {
                                const q = getQuestionDetails(h.questionId);
                                const correctText = q ? q.rawAnswer.map(i => ['A','B','C','D','E'][i]).join('') : '?';

                                return (
                                    <div key={h.id} onClick={() => openQuestion(h.questionId)} className="flex gap-3 pb-3 border-b border-slate-50 last:border-0 last:pb-0 cursor-pointer hover:bg-slate-50 p-2 -mx-2 rounded-lg transition-colors">
                                        <div className={`mt-0.5 ${h.isCorrect ? 'text-green-500' : 'text-red-500'}`}>
                                            {h.action==='memorize' ? <Eye size={18} className="text-purple-500"/> : (h.isCorrect ? <CheckCircle size={18}/> : <XCircle size={18}/>)}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-sm font-medium text-slate-800 line-clamp-2">{h.questionTitle}</div>
                                            <div className="flex items-center gap-3 mt-1.5 text-xs text-slate-500">
                                                {h.action==='answer' && (
                                                    <>
                                                        <span className={`px-1.5 py-0.5 rounded border ${h.isCorrect?'bg-green-50 border-green-200 text-green-700':'bg-red-50 border-red-200 text-red-700'}`}>选 {h.userAnswer}</span>
                                                        {!h.isCorrect && <span className="font-bold text-green-600">正解 {correctText}</span>}
                                                    </>
                                                )}
                                                {h.action==='memorize' && <span className="text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded border border-purple-100">背题模式</span>}
                                                <span className="ml-auto text-slate-400">{new Date(h.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                                            </div>
                                        </div>
                                        <ArrowRight size={16} className="self-center text-slate-300"/>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>

                {/* Question Detail Modal */}
                {viewingQuestion && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in" onClick={() => setViewingQuestion(null)}>
                        <div className="bg-white w-full max-w-lg max-h-[80vh] overflow-y-auto rounded-2xl p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                            <div className="flex justify-between items-start mb-4">
                                <div className="flex gap-2">
                                        <span className={`text-xs px-2 py-1 rounded font-bold ${viewingQuestion.type==='multiple'?'bg-purple-100 text-purple-700':'bg-blue-100 text-blue-700'}`}>
                                            {viewingQuestion.type==='multiple'?'多选':(viewingQuestion.type==='judgment'?'判断':'单选')}
                                        </span>
                                    <span className="text-xs px-2 py-1 bg-slate-100 text-slate-500 rounded">{viewingQuestion.id}</span>
                                </div>
                                <button onClick={() => setViewingQuestion(null)} className="p-1 hover:bg-slate-100 rounded-full"><X size={20}/></button>
                            </div>
                            <h3 className="text-lg font-bold text-slate-900 mb-6">{viewingQuestion.question}</h3>
                            <div className="space-y-3 mb-6">
                                {viewingQuestion.options.map((opt, i) => {
                                    const isCorrect = viewingQuestion.rawAnswer.includes(i);
                                    return (
                                        <div key={i} className={`p-3 rounded-lg border text-sm flex gap-3 ${isCorrect ? 'bg-green-50 border-green-200 text-green-800' : 'bg-white border-slate-100 text-slate-600'}`}>
                                            <span className={`font-bold ${isCorrect?'text-green-600':'text-slate-400'}`}>{['A','B','C','D','E'][i]}.</span>
                                            <span>{opt}</span>
                                            {isCorrect && <CheckCircle size={16} className="ml-auto text-green-600"/>}
                                        </div>
                                    )
                                })}
                            </div>
                            <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                                <div className="flex items-center gap-2 mb-2 text-indigo-900 font-bold text-sm"><Zap size={16}/> 解析</div>
                                <p className="text-indigo-800 text-sm leading-relaxed">{viewingQuestion.explanation}</p>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        )
    }

    createRoot(document.getElementById('root')).render(<ReportApp />);
</script>
</body>
</html>
