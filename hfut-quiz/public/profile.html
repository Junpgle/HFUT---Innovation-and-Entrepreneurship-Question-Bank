<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - HFUT 创新创业</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <!-- LeanCloud -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    import ReactDOM from "react-dom/client";
    import React from "react";

    const { useState, useEffect } = React;

    // --- Icons ---
    const IconBase = ({ d, className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d={d} />
        </svg>
    );
    const Icons = {
        User: (p) => <IconBase {...p} d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />,
        Mail: (p) => <IconBase {...p} d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z M22 6l-10 7L2 6" />,
        Check: (p) => <IconBase {...p} d="M20 6 9 17l-5-5" />,
        Alert: (p) => <IconBase {...p} d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01" />,
        ArrowLeft: (p) => <IconBase {...p} d="M19 12H5 M12 19l-7-7 7-7" />,
        Lock: (p) => <IconBase {...p} d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z M7 11V7a5 5 0 0 1 10 0v4" />
    };

    // --- Config ---
    const LC_APP_ID = "5wPsbnakcoOjfaPzfC44vfW5-gzGzoHsz";
    const LC_APP_KEY = "j9qbdfjiJAPsqbGUy04COFTD";
    const LC_SERVER_URL = "https://5wpsbnak.lc-cn-n1-shared.com";

    function ProfileApp() {
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [emailInput, setEmailInput] = useState("");
        const [msg, setMsg] = useState({ type: '', text: '' });
        const [isEditingEmail, setIsEditingEmail] = useState(false);

        // 安全跳转函数：防止在预览环境因路径问题报错崩溃
        const safeNavigate = (url) => {
            try {
                window.location.href = url;
            } catch (e) {
                console.error("Navigation error:", e);
                alert("跳转失败：当前环境不支持页面间跳转，请手动返回。");
            }
        };

        useEffect(() => {
            if (window.AV) {
                window.AV.init({ appId: LC_APP_ID, appKey: LC_APP_KEY, serverURL: LC_SERVER_URL });
                const current = window.AV.User.current();
                if (current) {
                    setUser(current);
                    setEmailInput(current.getEmail() || "");
                    setLoading(false);
                } else {
                    // 尝试重定向到主页，如果环境不支持（如报错）则显示手动返回界面
                    try {
                        window.location.href = 'index.html';
                    } catch (e) {
                        console.warn("Auto-redirect blocked by environment:", e);
                        setLoading(false); // 停止加载，显示未登录界面
                    }
                }
            }
        }, []);

        const handleBindEmail = async (e) => {
            e.preventDefault();
            setMsg({ type: 'info', text: '正在处理...' });
            try {
                if(user.getEmail() === emailInput && user.get('emailVerified')) {
                    setMsg({ type: 'error', text: '该邮箱已绑定且已验证' });
                    return;
                }

                user.setEmail(emailInput);
                await user.save();

                setMsg({ type: 'success', text: '验证邮件已发送！请前往邮箱点击链接验证，验证后请刷新此页面。' });
                setIsEditingEmail(false);
            } catch (err) {
                setMsg({ type: 'error', text: '绑定失败: ' + err.message });
            }
        };

        const resendVerification = async () => {
            setMsg({ type: 'info', text: '正在发送...' });
            try {
                await window.AV.User.requestEmailVerify(user.getEmail());
                setMsg({ type: 'success', text: '验证邮件已重新发送，请查收。' });
            } catch(err) {
                setMsg({ type: 'error', text: '发送失败: ' + err.message });
            }
        };

        const logout = () => {
            window.AV.User.logOut();
            safeNavigate('index.html');
        };

        if (loading) return <div className="min-h-screen flex items-center justify-center text-slate-500">加载中...</div>;

        // 处理未登录/自动跳转失败的情况
        if (!user) {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
                    <div className="bg-white p-8 rounded-3xl shadow-lg text-center max-w-sm w-full">
                        <div className="w-16 h-16 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Icons.User className="w-8 h-8" />
                        </div>
                        <h2 className="text-xl font-bold text-slate-800 mb-2">请先登录</h2>
                        <p className="text-slate-500 mb-6 text-sm">无法自动跳转到登录页，请手动返回。</p>
                        <button onClick={() => safeNavigate('index.html')} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-black transition">
                            返回主页
                        </button>
                    </div>
                </div>
            );
        }

        const isVerified = user.get('emailVerified');
        const hasEmail = !!user.getEmail();

        return (
            <div className="min-h-screen p-4 md:p-8 flex justify-center">
                <div className="w-full max-w-lg space-y-6">
                    {/* Header */}
                    <div className="flex items-center gap-4">
                        <button onClick={() => safeNavigate('index.html')} className="p-2 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
                            <Icons.ArrowLeft className="text-slate-600" />
                        </button>
                        <h1 className="text-2xl font-bold text-slate-800">个人账号中心</h1>
                    </div>

                    {/* Info Card */}
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="w-16 h-16 bg-gradient-to-tr from-blue-500 to-indigo-500 rounded-full flex items-center justify-center text-white text-2xl font-bold">
                                {user.getUsername().charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h2 className="text-xl font-bold text-slate-900">{user.getUsername()}</h2>
                                <p className="text-slate-500 text-sm">ID: {user.id}</p>
                            </div>
                        </div>

                        {/* Email Section */}
                        <div className="bg-slate-50 rounded-2xl p-5 border border-slate-100 mb-4">
                            <div className="flex justify-between items-start mb-2">
                                <div className="flex items-center gap-2 text-slate-700 font-bold">
                                    <Icons.Mail className="text-blue-500" /> 邮箱绑定
                                </div>
                                {hasEmail && (
                                    <span className={`px-2 py-1 rounded text-xs font-bold ${isVerified ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>
                                        {isVerified ? '已验证' : '未验证'}
                                    </span>
                                )}
                            </div>

                            {!isEditingEmail && hasEmail ? (
                                <div>
                                    <div className="text-lg font-mono text-slate-600 mb-3">{user.getEmail()}</div>
                                    <div className="flex gap-2">
                                        {!isVerified && (
                                            <button onClick={resendVerification} className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold hover:bg-blue-200 transition">
                                                重发验证邮件
                                            </button>
                                        )}
                                        <button onClick={() => setIsEditingEmail(true)} className="px-3 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm font-bold hover:bg-slate-50 transition">
                                            修改邮箱
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <form onSubmit={handleBindEmail} className="mt-3">
                                    <input
                                        type="email"
                                        required
                                        placeholder="输入您的邮箱地址"
                                        className="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none mb-3"
                                        value={emailInput}
                                        onChange={e => setEmailInput(e.target.value)}
                                    />
                                    <div className="flex gap-2">
                                        <button type="submit" className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">
                                            保存并发送验证
                                        </button>
                                        {hasEmail && (
                                            <button type="button" onClick={() => setIsEditingEmail(false)} className="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50">
                                                取消
                                            </button>
                                        )}
                                    </div>
                                </form>
                            )}
                        </div>

                        {/* Password Section (Optional Link) */}
                        <div className="bg-slate-50 rounded-2xl p-5 border border-slate-100">
                            <div className="flex items-center gap-2 text-slate-700 font-bold mb-2">
                                <Icons.Lock className="text-slate-400" /> 安全设置
                            </div>
                            <button
                                onClick={async () => {
                                    if(!isVerified) {
                                        setMsg({type:'error', text:'请先绑定并验证邮箱后才能重置密码'});
                                        return;
                                    }
                                    try {
                                        await window.AV.User.requestPasswordReset(user.getEmail());
                                        setMsg({type:'success', text:'密码重置邮件已发送至您的邮箱'});
                                    } catch(e) {
                                        setMsg({type:'error', text: e.message});
                                    }
                                }}
                                className="text-sm text-blue-600 hover:underline font-medium"
                            >
                                发送密码重置邮件
                            </button>
                        </div>
                    </div>

                    {/* Feedback Message */}
                    {msg.text && (
                        <div className={`p-4 rounded-2xl flex items-center gap-3 ${msg.type === 'error' ? 'bg-red-50 text-red-700' : (msg.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-blue-50 text-blue-700')}`}>
                            {msg.type === 'error' ? <Icons.Alert /> : <Icons.Check />}
                            <span>{msg.text}</span>
                        </div>
                    )}

                    <button onClick={logout} className="w-full py-4 text-slate-400 font-bold hover:text-red-500 transition-colors">
                        退出登录
                    </button>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ProfileApp />);
</script>
</body>
</html>
