    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- 1. 引入 Tailwind CSS -->

</head>
<body class="antialiased h-screen overflow-hidden">
<div id="root" class="h-full"></div>

<!-- 4. React 应用逻辑 -->
<script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
        BookOpen, CheckCircle, XCircle, Brain, History, Settings,
        ChevronRight, ChevronLeft, RotateCcw, Clock, PlayCircle, Eye,
        User, Github, LogOut, AlertCircle, Layers, Loader2,
        Filter, ListChecks, AlertTriangle, PieChart, BarChart3,
        CheckSquare, GraduationCap, Zap, LayoutGrid, Check, Menu, X,
        UploadCloud, DownloadCloud, RefreshCw, Bookmark
    } from 'lucide-react';

    // --- 配置常量 ---
    const LC_APP_ID = "5wPsbnakcoOjfaPzfC44vfW5-gzGzoHsz";
    const LC_APP_KEY = "j9qbdfjiJAPsqbGUy04COFTD";
    const LC_SERVER_URL = "https://5wpsbnak.lc-cn-n1-shared.com";
    const GITHUB_BASE = "https://raw.githubusercontent.com/Junpgle/HFUT---Innovation-and-Entrepreneurship-Question-Bank/refs/heads/main/questions/";

    const LECTURES = [
        { id: 1, name: "第一讲：创新创业概述", file: "创新创业基础第一讲习题.xlsx" },
        { id: 2, name: "第二讲：创新思维与方法", file: "创新创业基础第二讲习题.xlsx" },
        { id: 3, name: "第三讲：机会与风险识别", file: "创新创业基础第三讲习题.xlsx" },
        { id: 4, name: "第四讲：团队与资源整合", file: "创新创业基础第四讲习题.xlsx" },
        { id: 5, name: "第五讲：商业模式与计划", file: "创新创业基础第五讲习题.xlsx" },
        { id: 6, name: "第六讲：融资与企业设立", file: "创新创业基础第六讲习题.xlsx" },
        { id: 7, name: "第七讲：新企业成长管理", file: "创新创业基础第七讲习题.xlsx" },
    ];

    const loadScript = (src) => {
        return new Promise((resolve, reject) => {
            if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
            const script = document.createElement('script');
            script.src = src;
            script.crossOrigin = "anonymous";
            script.onload = resolve;
            script.onerror = () => reject(new Error(`无法加载脚本: ${src}`));
            document.head.appendChild(script);
        });
    };

    // --- LocalStorage 辅助函数 ---
    const loadSetFromLocal = (key) => {
        try {
            const stored = localStorage.getItem(key);
            return stored ? new Set(JSON.parse(stored)) : new Set();
        } catch (e) { return new Set(); }
    };
    const loadHistoryFromLocal = () => {
        try {
            const stored = localStorage.getItem('app_history');
            return stored ? JSON.parse(stored) : [];
        } catch (e) { return []; }
    };
    const loadSessionFromLocal = () => {
        try {
            const stored = localStorage.getItem('app_lastSession');
            return stored ? JSON.parse(stored) : null;
        } catch (e) { return null; }
    }

    function App() {
        // --- 系统状态 ---
        const [sdkReady, setSdkReady] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);
        const [authMode, setAuthMode] = useState('login');
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [authLoading, setAuthLoading] = useState(false);
        const [authError, setAuthError] = useState(null);

        // --- 题库状态 ---
        const [allQuestionBank, setAllQuestionBank] = useState({});
        const [questions, setQuestions] = useState([]);

        // --- 练习配置 ---
        const [quizConfig, setQuizConfig] = useState({
            lectureId: 0, count: 20, type: 'all', filter: 'all'
        });

        // --- 全局加载 ---
        const [isGlobalLoading, setIsGlobalLoading] = useState(false);
        const [loadingProgress, setLoadingProgress] = useState("");
        const [errorMsg, setErrorMsg] = useState(null);

        // --- 同步状态反馈 ---
        const [syncStatus, setSyncStatus] = useState(null);
        const [syncMsg, setSyncMsg] = useState("");

        // --- 学习进度 ---
        const [brushedIds, setBrushedIds] = useState(loadSetFromLocal('app_brushedIds'));
        const [memorizedIds, setMemorizedIds] = useState(loadSetFromLocal('app_memorizedIds'));
        const [masteredIds, setMasteredIds] = useState(loadSetFromLocal('app_masteredIds'));
        const [wrongIds, setWrongIds] = useState(loadSetFromLocal('app_wrongIds'));
        const [history, setHistory] = useState(loadHistoryFromLocal());

        // --- 断点续传 Session ---
        const [lastSession, setLastSession] = useState(loadSessionFromLocal());

        // --- 界面交互 ---
        const [currentMode, setCurrentMode] = useState('dashboard');
        const [currentIndex, setCurrentIndex] = useState(0);
        const [showExplanation, setShowExplanation] = useState(false);
        const [selectedIndices, setSelectedIndices] = useState([]);
        const [isAnswered, setIsAnswered] = useState(false);

        // 1. 初始化 SDK
        useEffect(() => {
            const initSDKs = async () => {
                try {
                    await loadScript("https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js");
                    await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js");

                    if (window.AV) {
                        window.AV.init({ appId: LC_APP_ID, appKey: LC_APP_KEY, serverURL: LC_SERVER_URL });
                        const user = window.AV.User.current();
                        if (user) setCurrentUser(user);
                        setSdkReady(true);
                    }
                } catch (err) {
                    console.error("SDK Load Error:", err);
                    setErrorMsg(`组件加载失败: ${err.message}. 请检查网络或刷新页面.`);
                }
            };
            initSDKs();
        }, []);

        // 2. 监听状态变化
        useEffect(() => { localStorage.setItem('app_brushedIds', JSON.stringify(Array.from(brushedIds))); }, [brushedIds]);
        useEffect(() => { localStorage.setItem('app_memorizedIds', JSON.stringify(Array.from(memorizedIds))); }, [memorizedIds]);
        useEffect(() => { localStorage.setItem('app_masteredIds', JSON.stringify(Array.from(masteredIds))); }, [masteredIds]);
        useEffect(() => { localStorage.setItem('app_wrongIds', JSON.stringify(Array.from(wrongIds))); }, [wrongIds]);
        useEffect(() => { localStorage.setItem('app_history', JSON.stringify(history)); }, [history]);
        useEffect(() => {
            if (lastSession) localStorage.setItem('app_lastSession', JSON.stringify(lastSession));
            else localStorage.removeItem('app_lastSession');
        }, [lastSession]);

        // 3. 题库解析器
        const parseExcelData = (rows, lectureId, lectureName) => {
            const cleanRows = rows.filter(r => r && r.length > 0);
            if (cleanRows.length === 0) return [];
            const questions = [];
            let startIndex = 0;

            const headerStr = JSON.stringify(cleanRows[0]);
            if (headerStr.includes("题型") || headerStr.includes("题干")) startIndex = 1;

            for (let i = startIndex; i < cleanRows.length; i++) {
                const row = cleanRows[i];
                const typeRaw = String(row[0] || "").trim();
                const content = String(row[1] || "").trim();
                const answerRaw = String(row[2] || "").trim();
                const explanation = String(row[3] || "").trim();

                if (!content) continue;

                let type = 'single';
                if (typeRaw.includes("多选")) type = 'multiple';
                else if (typeRaw.includes("判断")) type = 'judgment';

                let options = [];
                let correctAnswers = [];

                if (type === 'judgment') {
                    options = ['正确', '错误'];
                    if (/^[对TtA√]/.test(answerRaw)) correctAnswers = [0];
                    else if (/^[错FfB×]/.test(answerRaw)) correctAnswers = [1];
                    else correctAnswers = [0];
                } else {
                    const optA = row[6]; const optB = row[7]; const optC = row[8]; const optD = row[9]; const optE = row[10];
                    if (optA) options.push(String(optA).trim());
                    if (optB) options.push(String(optB).trim());
                    if (optC) options.push(String(optC).trim());
                    if (optD) options.push(String(optD).trim());
                    if (optE) options.push(String(optE).trim());

                    const normalizedAns = answerRaw.toUpperCase().replace(/[^A-E]/g, '');
                    for (let char of normalizedAns) {
                        const idx = char.charCodeAt(0) - 65;
                        if (idx >= 0 && idx < options.length) correctAnswers.push(idx);
                    }
                }

                if (options.length === 0) continue;

                questions.push({
                    id: `L${lectureId}-${i}`,
                    type,
                    question: content,
                    options,
                    rawAnswer: correctAnswers.sort((a,b)=>a-b),
                    explanation: explanation || "暂无解析",
                    category: lectureName,
                    lectureId: lectureId
                });
            }
            return questions;
        };

        // 4. 加载题库
        useEffect(() => {
            if (!sdkReady) return;
            const fetchAllLectures = async () => {
                if (Object.keys(allQuestionBank).length > 0) return;

                setIsGlobalLoading(true);
                setLoadingProgress("正在连接题库服务器...");
                const newBank = {};

                for (let i = 0; i < LECTURES.length; i++) {
                    const lecture = LECTURES[i];
                    setLoadingProgress(`正在加载: ${lecture.name} (${i + 1}/${LECTURES.length})`);
                    try {
                        const url = `${GITHUB_BASE}${encodeURIComponent(lecture.file)}`;
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const blob = await response.blob();
                        const arrayBuffer = await blob.arrayBuffer();
                        const data = new Uint8Array(arrayBuffer);
                        const workbook = window.XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rawData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        const parsed = parseExcelData(rawData, lecture.id, lecture.name);
                        if (parsed.length > 0) newBank[lecture.id] = parsed;
                    } catch (err) {
                        console.warn(`Load failed: ${lecture.file}`, err);
                    }
                }
                setAllQuestionBank(newBank);
                setIsGlobalLoading(false);
            };
            fetchAllLectures();
        }, [sdkReady]);

        // 5. 初始化：登录后，尝试自动拉取一次数据并合并
        useEffect(() => {
            if (!currentUser || !sdkReady) return;
            if (brushedIds.size === 0) {
                handleManualRestore(true);
            }
        }, [currentUser, sdkReady]);

        // 6. 后台自动保存 (防抖)
        const saveTimeoutRef = useRef(null);
        useEffect(() => {
            if (!currentUser || !sdkReady) return;
            if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
            saveTimeoutRef.current = setTimeout(() => {
                handleManualSync(true);
            }, 5000);
            return () => clearTimeout(saveTimeoutRef.current);
        }, [brushedIds, memorizedIds, masteredIds, wrongIds, history]);

        // --- 同步逻辑 ---
        const handleManualSync = async (silent = false) => {
            if (!currentUser) return;
            if (!silent) { setSyncStatus('uploading'); setSyncMsg("正在备份到云端..."); }

            try {
                const AV = window.AV;
                const query = new AV.Query('UserProgress');
                query.equalTo('user', currentUser);

                let progressRecord;
                try {
                    progressRecord = await query.first();
                } catch (error) {
                    if (error.code === 101 || error.message.includes("Class or object doesn't exists")) {
                        progressRecord = null;
                    } else {
                        throw error;
                    }
                }

                if (!progressRecord) {
                    const UserProgress = AV.Object.extend('UserProgress');
                    progressRecord = new UserProgress();
                    progressRecord.set('user', currentUser);
                    const acl = new AV.ACL();
                    acl.setPublicReadAccess(false);
                    acl.setPublicWriteAccess(false);
                    acl.setReadAccess(currentUser, true);
                    acl.setWriteAccess(currentUser, true);
                    progressRecord.setACL(acl);
                }
                progressRecord.set('brushedIds', Array.from(brushedIds));
                progressRecord.set('memorizedIds', Array.from(memorizedIds));
                progressRecord.set('masteredIds', Array.from(masteredIds));
                progressRecord.set('wrongIds', Array.from(wrongIds));
                progressRecord.set('history', history.slice(0, 500));
                await progressRecord.save();

                if (!silent) {
                    setSyncStatus('success');
                    setSyncMsg("备份成功");
                    setTimeout(() => setSyncStatus(null), 2000);
                }
            } catch (e) {
                console.error(e);
                if (!silent) {
                    setSyncStatus('error');
                    setSyncMsg("备份失败: " + e.message);
                    setTimeout(() => setSyncStatus(null), 3000);
                }
            }
        };

        const handleManualRestore = async (silent = false) => {
            if (!currentUser) return;
            if (!silent) { setSyncStatus('downloading'); setSyncMsg("正在拉取云端存档..."); }

            try {
                const query = new window.AV.Query('UserProgress');
                query.equalTo('user', currentUser);

                let result;
                try {
                    result = await query.first();
                } catch (error) {
                    if (error.code === 101 || error.message.includes("Class or object doesn't exists")) {
                        result = null;
                    } else {
                        throw error;
                    }
                }

                if (result) {
                    const data = result.toJSON();
                    if (data.brushedIds) setBrushedIds(prev => new Set([...prev, ...data.brushedIds]));
                    if (data.memorizedIds) setMemorizedIds(prev => new Set([...prev, ...data.memorizedIds]));
                    if (data.masteredIds) setMasteredIds(prev => new Set([...prev, ...data.masteredIds]));
                    if (data.wrongIds) setWrongIds(prev => new Set([...prev, ...data.wrongIds]));
                    if (data.history && data.history.length > 0) {
                        if(history.length === 0) setHistory(data.history);
                    }
                    if (!silent) {
                        setSyncStatus('success');
                        setSyncMsg("同步完成");
                        setTimeout(() => setSyncStatus(null), 2000);
                    }
                } else {
                    if (!silent) {
                        setSyncMsg("云端暂无数据");
                        setTimeout(() => setSyncStatus(null), 2000);
                    }
                }
            } catch (err) {
                console.error(err);
                if (!silent) {
                    setSyncStatus('error');
                    setSyncMsg("拉取失败: " + err.message);
                    setTimeout(() => setSyncStatus(null), 3000);
                }
            }
        };

        // --- 业务逻辑 ---
        const generateAndStartQuiz = (mode = 'quiz') => {
            setLastSession(null);

            let sourcePool = quizConfig.lectureId === 0
                ? Object.values(allQuestionBank).flat()
                : (allQuestionBank[quizConfig.lectureId] || []);

            if (quizConfig.type !== 'all') {
                if (quizConfig.type === 'single') sourcePool = sourcePool.filter(q => q.type === 'single');
                if (quizConfig.type === 'multiple') sourcePool = sourcePool.filter(q => q.type === 'multiple');
                if (quizConfig.type === 'judgment') sourcePool = sourcePool.filter(q => q.type === 'judgment');
            }

            if (quizConfig.filter === 'new') sourcePool = sourcePool.filter(q => !brushedIds.has(q.id));
            else if (quizConfig.filter === 'wrong') sourcePool = sourcePool.filter(q => wrongIds.has(q.id));

            if (sourcePool.length === 0) { alert("该条件下没有可用题目"); return; }

            const shuffled = [...sourcePool].sort(() => 0.5 - Math.random());
            const limit = quizConfig.count === 'all' ? shuffled.length : Number(quizConfig.count);
            setQuestions(shuffled.slice(0, limit));
            startMode(mode);
        };

        const resumeLastSession = () => {
            if (!lastSession) return;
            setQuestions(lastSession.questions);
            setCurrentIndex(lastSession.currentIndex);
            setQuizConfig(lastSession.quizConfig);
            startMode(lastSession.mode);
        };

        const startMistakeNotebook = () => {
            setLastSession(null);
            const allQs = Object.values(allQuestionBank).flat();
            const wrongQs = allQs.filter(q => wrongIds.has(q.id));
            if (wrongQs.length === 0) { alert("暂无错题记录，继续保持！"); return; }
            wrongQs.sort(() => 0.5 - Math.random());
            setQuestions(wrongQs);
            startMode('mistakes');
        };

        const handleOptionClick = (idx) => {
            const currentQ = questions[currentIndex];
            const isMemorize = currentMode === 'memorize';

            if (isMemorize) return;
            if (isAnswered) return;

            if (currentQ.type === 'multiple') {
                setSelectedIndices(prev => {
                    if (prev.includes(idx)) return prev.filter(i => i !== idx);
                    return [...prev, idx];
                });
            } else {
                submitAnswer([idx]);
            }
        };

        const submitAnswer = (finalSelection = selectedIndices) => {
            if (finalSelection.length === 0) return;

            const currentQ = questions[currentIndex];
            const correctSet = new Set(currentQ.rawAnswer);
            const userSet = new Set(finalSelection);
            const isCorrect = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));

            setIsAnswered(true);
            setSelectedIndices(finalSelection);
            setShowExplanation(true);
            setBrushedIds(prev => new Set(prev).add(currentQ.id));

            if (isCorrect) {
                setWrongIds(prev => { const n = new Set(prev); n.delete(currentQ.id); return n; });
                setMasteredIds(prev => new Set(prev).add(currentQ.id));
            } else {
                setMasteredIds(prev => { const n = new Set(prev); n.delete(currentQ.id); return n; });
                setWrongIds(prev => new Set(prev).add(currentQ.id));
            }

            const answerText = finalSelection.sort().map(i => ['A','B','C','D','E'][i]).join('');

            setHistory(prev => [{
                id: Date.now(),
                questionId: currentQ.id,
                questionTitle: currentQ.question,
                action: 'answer',
                isCorrect: isCorrect,
                userAnswer: answerText,
                timestamp: new Date().toISOString(),
            }, ...prev]);
        };

        const handleMemorizeCheck = () => {
            setMemorizedIds(prev => new Set(prev).add(questions[currentIndex].id));
            setHistory(prev => [{
                id: Date.now(),
                questionId: questions[currentIndex].id,
                questionTitle: questions[currentIndex].question,
                action: 'memorize',
                timestamp: new Date().toISOString(),
            }, ...prev]);
            setTimeout(() => nextQuestion(), 400);
        };

        const startMode = (mode) => {
            setCurrentMode(mode);
            if (mode !== currentMode) {
                setSelectedIndices([]);
                setIsAnswered(false);
                setShowExplanation(false);
            }
        };

        const exitToDashboard = () => {
            if (['quiz', 'memorize', 'mistakes'].includes(currentMode) && questions.length > 0 && currentIndex < questions.length - 1) {
                const sessionData = {
                    mode: currentMode,
                    questions,
                    currentIndex,
                    quizConfig
                };
                setLastSession(sessionData);
            } else {
                setLastSession(null);
            }
            setCurrentMode('dashboard');
        };

        const changeQuestion = (idx) => {
            setCurrentIndex(idx);
            setSelectedIndices([]);
            setIsAnswered(false);
            setShowExplanation(false);
        }

        const nextQuestion = () => {
            if (currentIndex < questions.length - 1) changeQuestion(currentIndex + 1);
            else {
                alert("本组练习完成！");
                setLastSession(null);
                setCurrentMode('dashboard');
            }
        };
        const prevQuestion = () => {
            if (currentIndex > 0) changeQuestion(currentIndex - 1);
        };

        // --- UI 渲染 ---
        const LoadingScreen = ({ msg }) => (
            <div className="h-full flex flex-col items-center justify-center p-8 text-center bg-gray-50">
                <div className="relative mb-6">
                    <div className="w-16 h-16 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
                    <div className="absolute inset-0 flex items-center justify-center"><Loader2 size={24} className="text-blue-600" /></div>
                </div>
                <h2 className="text-xl font-bold text-gray-800">{msg}</h2>
            </div>
        );

        // 修改为函数式调用，解决输入焦点丢失问题
        const renderLoginScreen = () => (
            <div className="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 to-slate-200">
                <div className="glass p-10 rounded-3xl shadow-2xl w-full max-w-md border border-white/50">
                    <div className="text-center mb-8">
                        <div className="bg-gradient-to-tr from-blue-600 to-indigo-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/30 text-white transform rotate-3">
                            <Brain size={40} />
                        </div>
                        <h1 className="text-3xl font-bold text-slate-800">HFUT 创新创业</h1>
                        <p className="text-slate-500 mt-2 font-medium">Pro 学习系统</p>
                        {brushedIds.size > 0 && <p className="text-xs text-blue-500 mt-2">检测到本地有 {brushedIds.size} 条刷题记录</p>}
                    </div>
                    <form onSubmit={(e) => { e.preventDefault(); setAuthLoading(true); setAuthError(null); (authMode==='login'?window.AV.User.logIn(username,password):new window.AV.User().setUsername(username).setPassword(password).signUp()).then(u=>{setCurrentUser(u);setAuthLoading(false)}).catch(err=>{setAuthError(err.message||"失败");setAuthLoading(false)}) }} className="space-y-5">
                        <div className="space-y-4">
                            <input type="text" required placeholder="用户名 / 学号" className="w-full px-5 py-3 bg-white/50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all" value={username} onChange={e => setUsername(e.target.value)} />

                    </div>

                    <div className="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                        <h3 className="font-bold text-slate-900 mb-6 flex items-center gap-2"><Clock size={20} /> 最近学习记录</h3>
                        <div className="space-y-4">
                            {history.length === 0 ? <p className="text-slate-400 text-center py-8">暂无记录，快去刷题吧！</p> : history.slice(0, 20).map(h => (
                                <div key={h.id} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl hover:bg-white hover:shadow-md transition-all border border-transparent hover:border-slate-100">
                                    <div className="flex items-center gap-4 overflow-hidden">
                                        <div className={`p-2 rounded-xl shrink-0 ${h.isCorrect?'bg-green-100 text-green-600':(h.action==='memorize'?'bg-purple-100 text-purple-600':'bg-red-100 text-red-600')}`}>
                                            {h.action==='memorize' ? <Eye size={20}/> : (h.isCorrect?<CheckSquare size={20}/>:<XCircle size={20}/>)}
                                        </div>
                                        <div className="truncate">
                                            <div className="font-bold text-slate-800 truncate text-sm">{h.questionTitle}</div>
                                            <div className="text-xs text-slate-400 mt-1">{new Date(h.timestamp).toLocaleString()} · {h.action==='memorize'?'背题':'刷题'}</div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );

        if (!sdkReady) return <LoadingScreen msg="正在连接云端系统..." />;
        if (isGlobalLoading) return <LoadingScreen msg={loadingProgress} />;
        if (!currentUser) return renderLoginScreen();

        return (
            <div className="h-full bg-slate-50 font-sans text-slate-900">
                {currentMode === 'dashboard' && renderDashboard()}
                {['quiz', 'memorize', 'mistakes'].includes(currentMode) && renderCard()}
                {currentMode === 'history' && renderHistory()}
            </div>
        );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
